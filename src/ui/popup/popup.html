<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breaking the Barrier</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="header">
        <div class="product-mark" aria-hidden="true">
          <span></span><i></i><span></span>
        </div>
        <div class="heading">
          <p class="eyebrow">Breaking the Barrier</p>
          <h1>Japanese romanization</h1>
        </div>
        <span id="page-state" class="page-state" data-state="idle">
          Original
        </span>
      </div>
      <p class="description">
        Romanize readable Japanese on this page locally. Show Original to
        restore text without reloading.
      </p>
      <button id="page-action" type="button" aria-busy="false">
        Romanize this page
      </button>
      <p
        id="status"
        class="status"
        data-state="idle"
        role="status"
        aria-live="polite"
      >
        Current page is original
      </p>
      <section id="site-memory" class="site-memory" hidden>
        <div class="site-memory-control">
          <div>
            <label for="remember-site">Remember for this site</label>
            <p id="site-host" class="site-host"></p>
          </div>
          <input
            id="remember-site"
            type="checkbox"
            role="switch"
            aria-describedby="site-explanation site-status"
            disabled
          />
        </div>
        <p id="site-explanation" class="site-explanation">
          Allows Breaking the Barrier to check pages on this site
          automatically. Text stays on this device.
        </p>
        <p
          id="site-status"
          class="site-status"
          data-state="idle"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
