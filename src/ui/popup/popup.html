<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breaking the Barrier</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="product-mark" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>
      <div>
        <p class="eyebrow">Breaking the Barrier</p>
        <h1>Japanese romanization</h1>
      </div>
      <p class="description">
        Romanize readable Japanese on this page locally. Show Original to
        restore text without reloading.
      </p>
      <button id="page-action" type="button">Romanize this page</button>
      <p
        id="status"
        class="status"
        data-state="idle"
        role="status"
        aria-live="polite"
      >
        Current page is original
      </p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
